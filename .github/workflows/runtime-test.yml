name: runtime-test

# GitHub-only runtime test: launches the real Minecraft 1.21.11 NeoForge client
# headlessly (HeadlessMC + Xvfb via mc-runtime-test), which reaches the
# title screen, joins a single-player world, then quits cleanly.
# Surviving this proves the mod (and its mixins) loads at the title screen
# AND in-game with no mixin errors.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  java_version: 21

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --warning-mode all

      - name: Stage mod for test client
        run: |
          mkdir -p run/mods
          cp build/libs/infinity-1.21.11-neoforge-*.jar run/mods/
          ls -la run/mods/

      - name: Run Minecraft 1.21.11 client (title screen + in-game world load)
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: 1.21.11
          modloader: neoforge
          mc-runtime-test: neoforge
          java: 21
          xvfb: "true"
          fabric-api: none
          headlessmc-command: '--jvm "-DMcRuntimeGameTest=false"'

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-logs
          path: |
            run/logs/
            .minecraft/logs/
            **/latest.log
          if-no-files-found: warn
